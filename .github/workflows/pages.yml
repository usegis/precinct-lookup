name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: [public/**, counties/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: cp -R counties public/counties
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:  # its own job, as in GitHub's template, so the artifact is listed before deploy looks for it
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
